<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<text x="900" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">端侧癫痫 AI 模型（每 10s 窗口推理）</text>
<line x1="240" y1="215" x2="320" y2="215" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<line x1="520" y1="215" x2="600" y2="215" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<line x1="860" y1="215" x2="940" y2="215" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<line x1="1130" y1="215" x2="1210" y2="210" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<polyline points="1315,270 1315,270 1315,130 1615,130 1615,140 1615,140" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<rect x="1300" y="246" width="150" height="20" rx="4" fill="#fff" opacity="0.9" stroke="#ccc"/><text x="1375" y="262" text-anchor="middle" font-size="11" fill="#222">是</text>
<line x1="1730" y1="200" x2="1500" y2="397" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" />
<polyline points="1315,150 1315,150 1315,105 115,105 115,170 140,170" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arr)" stroke-dasharray="7,6" />
<rect x="1300" y="126" width="150" height="20" rx="4" fill="#fff" opacity="0.9" stroke="#ccc"/><text x="1375" y="142" text-anchor="middle" font-size="11" fill="#222">否 -> 下一窗口</text>
<rect x="40" y="170" width="200" height="90" rx="9" fill="#f5f5f5" stroke="#666666" stroke-width="1.7"/>
<text x="140" y="208" text-anchor="middle" font-size="12" fill="#202020">特征窗口 200x7</text>
<text x="140" y="225" text-anchor="middle" font-size="12" fill="#202020">10s @ 20Hz 滑动</text>
<rect x="320" y="170" width="200" height="90" rx="9" fill="#e8f0fe" stroke="#6c8ebf" stroke-width="1.7"/>
<text x="420" y="208" text-anchor="middle" font-size="12" fill="#202020">z-score 归一化</text>
<text x="420" y="225" text-anchor="middle" font-size="12" fill="#202020">mean/std <- JSON</text>
<rect x="600" y="140" width="260" height="150" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.7"/>
<text x="730" y="200" text-anchor="middle" font-size="12" fill="#202020">TFLite-Micro int8 CNN</text>
<text x="730" y="217" text-anchor="middle" font-size="12" fill="#202020">Conv2D->MaxPool->GAP->FC->Sigmoid</text>
<text x="730" y="234" text-anchor="middle" font-size="12" fill="#202020">8.4KB / SPIFFS model 分区</text>
<rect x="940" y="170" width="190" height="90" rx="9" fill="#d5e8d4" stroke="#82b366" stroke-width="1.7"/>
<text x="1035" y="217" text-anchor="middle" font-size="12" fill="#202020">输出概率 P in [0,1]</text>
<polygon points="1315,150 1420,210 1315,270 1210,210" fill="#fff2cc" stroke="#d6b656" stroke-width="1.7"/>
<text x="1315" y="203" text-anchor="middle" font-size="12" fill="#202020">P>=0.81 ?</text>
<text x="1315" y="220" text-anchor="middle" font-size="12" fill="#202020">或 SpO2 低于 90%</text>
<rect x="1500" y="140" width="230" height="120" rx="9" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.7"/>
<text x="1615" y="185" text-anchor="middle" font-size="12" fill="#202020">风险等级 0~100</text>
<text x="1615" y="202" text-anchor="middle" font-size="12" fill="#202020">Round(P*100)</text>
<text x="1615" y="219" text-anchor="middle" font-size="12" fill="#202020">SpO2 低于 90 强制 >=90</text>
<rect x="1500" y="330" width="230" height="135" rx="9" fill="#f8cecc" stroke="#b85450" stroke-width="1.7"/>
<text x="1615" y="365" text-anchor="middle" font-size="12" fill="#202020">MQTT / OneNET</text>
<text x="1615" y="382" text-anchor="middle" font-size="12" fill="#202020">abnormal_motion_detected</text>
<text x="1615" y="399" text-anchor="middle" font-size="12" fill="#202020">heart_rate</text>
<text x="1615" y="416" text-anchor="middle" font-size="12" fill="#202020">oxygen_saturation</text>
<text x="1615" y="433" text-anchor="middle" font-size="12" fill="#202020">seizure_risk_level</text>
